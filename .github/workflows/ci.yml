name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arabianpay_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - name: Import MySQL schema
        run: mysql -h 127.0.0.1 -u test -ptest arabianpay_test < database/schema/mysql-schema.sql
      - run: php artisan test --coverage --min=15
        env:
          DB_DATABASE: arabianpay_test
          DB_USERNAME: test
          DB_PASSWORD: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: tests/coverage/
