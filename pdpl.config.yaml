# PDPL Scanner configuration
# Generated by `pdpl-scan init`. Commit this so every scan uses the same entity profile.
entity:
  type: financial                 # SAMA-regulated (bank, insurance, finance co., payment provider, credit bureau, fintech)
  data_classification: top_secret   # top_secret | secret | confidential | public
  is_public_entity: false
  is_foreign_entity: false
  processes_sensitive_data: true
  processes_children_data: false
  cross_border_transfers: false
  large_scale_processing: true
  uses_ai_on_personal_data: false
scan:
  paths: ["src"]
  exclude: ["tests", "node_modules", "dist", "build"]
gate:
  fail_on: [critical]      # severities that fail the build
  weights: { critical: 25, high: 10, medium: 4, low: 1 }
