openapi: 3.0.3

info:
  title: ArabianPay Financial API
  version: 1.0.0
  description: |
    Financial module API for the ArabianPay BNPL admin panel.

    ## Authentication Flow (Sanctum SPA)

    1. `GET /sanctum/csrf-cookie` — fetch XSRF-TOKEN cookie
    2. `POST /login` — `{ email, password }`
       - If response has `{ two_factor: true }`, continue to step 3
    3. `POST /two-factor-challenge` — `{ code }`
    4. `GET /api/v1/user` — verify session, get roles & permissions

    All subsequent requests must include:
    - `XSRF-TOKEN` cookie (auto-sent with `withCredentials: true`)
    - `Content-Type: application/json`
    - `Accept: application/json`
    - `X-Requested-With: XMLHttpRequest`

servers:
  - url: https://core.arabianpay.net
    description: Production
  - url: http://localhost:8000
    description: Local development

tags:
  - name: User
    description: Current user info and session
  - name: Financial Dashboard
    description: KPI dashboard, trial balance, CSV exports
  - name: Chart of Accounts
    description: CRUD operations on the chart of accounts
  - name: Journal Transactions
    description: Financial journal (double-entry) transaction management
  - name: Expense Settings
    description: Predefined expense templates
  - name: Settlements
    description: Weekly supplier settlement lifecycle
  - name: Payouts
    description: Supplier payout portal and double-entry creation
  - name: Loan Transactions
    description: BNPL loan transaction management
  - name: Schedule Payments
    description: Installment schedule management
  - name: Collections
    description: Collections dashboard, installments, and recovery
  - name: Claims
    description: Collection claims lifecycle
  - name: Refund Requests
    description: Refund request management
  - name: Credit Management
    description: Customer credit profiles and limits
  - name: Investment Pools
    description: Monthly investment portfolio pools
  - name: Transfer Requests
    description: Entity transfer between employees
  - name: Financial Reports
    description: Financial analysis and reporting

paths:

  #
  # ─── User ──────────────────────────────────────────────────────────
  #

  /api/v1/user:
    get:
      tags: [User]
      summary: Current authenticated user
      description: "Returns the authenticated user's profile, roles, and permissions"
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  #
  # ─── Financial Dashboard ───────────────────────────────────────────
  #

  /api/v1/finance/dashboard:
    get:
      tags: [Financial Dashboard]
      summary: Financial dashboard
      description: KPI metrics, charts, recent activities, accounts summary, and investment pool summaries
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      kpis:
                        $ref: '#/components/schemas/DashboardKPIs'
                      charts:
                        $ref: '#/components/schemas/DashboardCharts'
                      recent_activities:
                        type: array
                      accounts_summary:
                        type: array
                      investment_pools:
                        $ref: '#/components/schemas/PoolSummary'

  /api/v1/finance/trial-balance:
    get:
      tags: [Financial Dashboard]
      summary: Trial balance
      description: Trial balance with debits, credits, and running balances per account
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          description: Trial balance data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                      balance_date:
                        type: string
                        format: date
                      total_debits:
                        type: number
                      total_credits:
                        type: number

  /api/v1/finance/trial-balance/export:
    get:
      tags: [Financial Dashboard]
      summary: Export trial balance as CSV
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/date'
      responses:
        '200':
          description: CSV file download

  #
  # ─── Chart of Accounts ─────────────────────────────────────────────
  #

  /api/v1/finance/accounts:
    get:
      tags: [Chart of Accounts]
      summary: List accounts
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - in: query
          name: account_type1
          schema: { type: integer, enum: [1, 2] }
          description: '1=Budget, 2=Non-Budget'
        - in: query
          name: account_type2
          schema: { type: integer, enum: [1, 2] }
          description: '1=Debit, 2=Credit'
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FAccount'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Chart of Accounts]
      summary: Create account
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAccountInput'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/FAccount'
                  message: { type: string }

  /api/v1/finance/accounts/{account}:
    parameters:
      - in: path
        name: account
        required: true
        schema: { type: integer }
        description: Account ID
    get:
      tags: [Chart of Accounts]
      summary: Show account with entries
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Account detail with paginated entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/FAccount'
                      entries:
                        type: array
                        items:
                          $ref: '#/components/schemas/FEntry'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
    put:
      tags: [Chart of Accounts]
      summary: Update account
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAccountInput'
      responses:
        '200':
          $ref: '#/components/responses/AccountUpdated'
    delete:
      tags: [Chart of Accounts]
      summary: Delete account (blocks if entries exist)
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '409':
          description: Has entries — cannot delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/finance/accounts/{account}/ledger:
    get:
      tags: [Chart of Accounts]
      summary: Account ledger with running balance
      description: Running balance computed across paginated pages. Filterable by date range and customer/supplier for AR (1203) / AP (2400) accounts.
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: account
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/date_from'
        - $ref: '#/components/parameters/date_to'
        - $ref: '#/components/parameters/per_page'
        - in: query
          name: customer_id
          schema: { type: integer }
          description: Filter by customer (for Accounts Receivable 1203)
        - in: query
          name: supplier_id
          schema: { type: integer }
          description: Filter by supplier (for Accounts Payable 2400)
      responses:
        '200':
          description: Ledger with running balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/FAccount'
                      entries:
                        type: array
                        items:
                          $ref: '#/components/schemas/FEntry'
                      opening_balance:
                        type: number
                      closing_balance:
                        type: number
                      totals:
                        type: object
                        properties:
                          sum_debit: { type: number }
                          sum_credit: { type: number }
                      is_debit_normal:
                        type: boolean
                      date_from:
                        type: string
                        format: date
                      date_to:
                        type: string
                        format: date
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  #
  # ─── Journal Transactions ──────────────────────────────────────────
  #

  /api/v1/finance/transactions:
    get:
      tags: [Journal Transactions]
      summary: List financial transactions
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - in: query
          name: type
          schema: { type: string, enum: [payment, refund, withdrawal, deposit, transfer] }
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FTransaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Journal Transactions]
      summary: Create financial transaction
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FTransactionInput'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/FTransaction'
                  message: { type: string }

  /api/v1/finance/transactions/create/form-data:
    get:
      tags: [Journal Transactions]
      summary: Form dropdown data
      description: Returns accounts, users, customers, suppliers, orders, and payments for form selectors
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Dropdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                      users:
                        type: array
                      customers:
                        type: array
                      suppliers:
                        type: array
                      orders:
                        type: array
                      payments:
                        type: array
                      transaction_types:
                        type: array
                      statuses:
                        type: array

  /api/v1/finance/transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Journal Transactions]
      summary: Show transaction with entries
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/FTransaction'
    put:
      tags: [Journal Transactions]
      summary: Update transaction
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FTransactionInput'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/FTransaction'
                  message: { type: string }
    delete:
      tags: [Journal Transactions]
      summary: Delete transaction (blocks if entries exist)
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Deleted
        '409':
          description: Has entries — cannot delete

  #
  # ─── Expense Settings ──────────────────────────────────────────────
  #

  /api/v1/finance/expense-settings:
    get:
      tags: [Expense Settings]
      summary: List expense settings
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: List of expense settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseSetting'
    post:
      tags: [Expense Settings]
      summary: Create expense setting
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseSettingInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ExpenseSetting'
                  message: { type: string }

  /api/v1/finance/expense-settings/{expenseSetting}:
    parameters:
      - in: path
        name: expenseSetting
        required: true
        schema: { type: integer }
    get:
      tags: [Expense Settings]
      summary: Show expense setting
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Expense setting detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ExpenseSetting'
    put:
      tags: [Expense Settings]
      summary: Update expense setting
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseSettingInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Expense Settings]
      summary: Delete expense setting
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Deleted

  #
  # ─── Settlements ───────────────────────────────────────────────────
  #

  /api/v1/settlements:
    get:
      tags: [Settlements]
      summary: List settlements with period summaries
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/date_from'
        - $ref: '#/components/parameters/date_to'
        - in: query
          name: supplier_id
          schema: { type: integer }
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: Settlements list with current/finished period data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      settlements:
                        type: array
                        items:
                          $ref: '#/components/schemas/Settlement'
                      periods:
                        type: object
                        properties:
                          current:
                            $ref: '#/components/schemas/PeriodSummary'
                          finished:
                            $ref: '#/components/schemas/PeriodSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /api/v1/settlements/generate:
    post:
      tags: [Settlements]
      summary: Generate settlements for finished period
      description: Creates draft settlements from delivered orders in the previous weekly period
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Settlements generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      settlements:
                        type: array
                        items:
                          $ref: '#/components/schemas/Settlement'

  /api/v1/settlements/{settlement}:
    parameters:
      - in: path
        name: settlement
        required: true
        schema: { type: integer }
    get:
      tags: [Settlements]
      summary: Settlement detail with orders, payouts, bank info
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Settlement detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/Settlement'

  /api/v1/settlements/{settlement}/approve:
    post:
      tags: [Settlements]
      summary: Approve a settlement
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: settlement
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/Settlement'
        '422':
          description: Cannot approve (wrong status, etc.)

  /api/v1/settlements/{settlement}/pay:
    post:
      tags: [Settlements]
      summary: Mark settlement as paid
      description: Creates payout record and double-entry financial entries (Debit AP 2400, Credit Bank 1201)
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Paid
        '422':
          description: Not in approved status

  /api/v1/settlements/{settlement}/cancel:
    post:
      tags: [Settlements]
      summary: Cancel a settlement
      description: Unlinks orders from the settlement. Cannot cancel a paid settlement.
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: settlement
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Cancelled

  /api/v1/settlements/batch/approve:
    post:
      tags: [Settlements]
      summary: Batch approve settlements
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_ids]
              properties:
                settlement_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Batch result

  /api/v1/settlements/batch/cancel:
    post:
      tags: [Settlements]
      summary: Batch cancel settlements
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_ids, reason]
              properties:
                settlement_ids:
                  type: array
                  items: { type: integer }
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Batch result

  /api/v1/settlements/batch/payout:
    post:
      tags: [Settlements]
      summary: Batch payout settlements
      description: All-or-nothing transaction. Creates payouts and financial entries for all approved settlements.
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_ids]
              properties:
                settlement_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: All processed
        '400':
          description: Some failed or all rolled back

  /api/v1/settlements/report:
    get:
      tags: [Settlements]
      summary: Generate payout report file
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: query
          name: settlement_ids
          required: true
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: false
      responses:
        '200':
          description: Report file download (PDF/txt)

  /api/v1/settlements/bank-transfer-file:
    get:
      tags: [Settlements]
      summary: Generate bank transfer CSV
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: query
          name: settlement_ids
          required: true
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: false
      responses:
        '200':
          description: CSV file download with beneficiary, account, bank, amount

  #
  # ─── Payouts ───────────────────────────────────────────────────────
  #

  /api/v1/payouts:
    get:
      tags: [Payouts]
      summary: List payout records
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/date_from'
        - $ref: '#/components/parameters/date_to'
        - in: query
          name: status
          schema: { type: string, enum: [pending, processing, ready_to_payout, paid, canceled] }
      responses:
        '200':
          description: Paginated payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierPayout'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Payouts]
      summary: Create payout
      description: Creates SupplierPayout + FTransaction + 2× FEntry (Debit AP 2400, Credit Bank 1201)
      security: [{ SanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: integer
                amount:
                  type: number
                  description: Optional — defaults to grand_total minus commission
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/SupplierPayout'
                  message: { type: string }

  /api/v1/payouts/status-by-order/{order}:
    get:
      tags: [Payouts]
      summary: Check payout status for an order
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Payout status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      order_id: { type: integer }
                      has_payout: { type: boolean }
                      status: { type: string, nullable: true }
                      payout_id: { type: integer, nullable: true }

  /api/v1/payouts/{payout}/complete:
    post:
      tags: [Payouts]
      summary: Mark payout as completed
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: payout
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Completed

  /api/v1/payouts/{payout}/fail:
    post:
      tags: [Payouts]
      summary: Mark payout as failed
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: path
          name: payout
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Failed

  #
  # ─── Loan Transactions ─────────────────────────────────────────────
  #

  /api/v1/loan-transactions:
    get:
      tags: [Loan Transactions]
      summary: List BNPL loan transactions
      security: [{ SanctumCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /api/v1/loan-transactions/wallet:
    get:
      tags: [Loan Transactions]
      summary: Seller wallet entries
      security: [{ SanctumCookie: [] }]
      responses:
        '200':
          description: Wallet entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
