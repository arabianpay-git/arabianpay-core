        - $ref: '#/components/parameters/date_to'
        - in: query
          name: customer_id
          schema: { type: integer }
      responses:
        '200':
          description: Credit history per customer

  /api/v1/reports/onboarding-funnel:
    get:
      tags: [Financial Reports]
      summary: Merchant onboarding funnel report
      security: [{ SanctumCookie: [] }]
      parameters:
        - in: query
          name: date_range
          schema: { type: string, enum: [1M, 3M, 6M, 12M], default: '1M' }
      responses:
        '200':
          description: Funnel metrics

components:

  securitySchemes:
    SanctumCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: |
        Sanctum SPA authentication. Before making authenticated requests:
        1. Send `GET /sanctum/csrf-cookie` to receive the XSRF-TOKEN cookie
        2. Include `withCredentials: true` in all requests
        3. Send `X-Requested-With: XMLHttpRequest` and `Accept: application/json` headers
        4. Use the session cookie set after successful login

  parameters:
    page:
      in: query
      name: page
      schema: { type: integer, default: 1 }
      description: Page number
    per_page:
      in: query
      name: per_page
      schema: { type: integer, default: 15, maximum: 100 }
      description: Items per page
    status:
      in: query
      name: status
      schema: { type: string }
      description: Filter by status
    date:
      in: query
      name: date
      schema: { type: string, format: date }
      description: Filter by date
    date_from:
      in: query
      name: date_from
      schema: { type: string, format: date }
      description: Start date filter
    date_to:
      in: query
      name: date_to
      schema: { type: string, format: date }
      description: End date filter
    search:
      in: query
      name: search
      schema: { type: string }
      description: Search query (searches user name, order ID, etc.)

  schemas:

    # ── Shared ─────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        message:
          type: string

    # ── User ──────────────────────────────────────────────────────

    UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
            email: { type: string }
            user_type: { type: string, enum: [admin, employee, supplier, customer] }
            profile_photo_url: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
            permissions:
              type: array
              items: { type: string }

    # ── Dashboard ─────────────────────────────────────────────────

    DashboardKPIs:
      type: object
      properties:
        total_assets: { type: number }
        total_liabilities: { type: number }
        monthly_revenue: { type: number }
        monthly_expenses: { type: number }
        cash_flow: { type: number }
        net_income: { type: number }
        accounts_receivable: { type: number }
        accounts_payable: { type: number }
        liquidity: { type: number }
        net_worth_trend: { type: number }
        net_income_trend: { type: number }
        accounts_receivable_trend: { type: number }
        accounts_payable_trend: { type: number }
        net_worth_sparkline:
          type: array
          items: { type: number }
          description: 6-month monthly values
        net_income_sparkline:
          type: array
          items: { type: number }
        accounts_receivable_sparkline:
          type: array
          items: { type: number }
        accounts_payable_sparkline:
          type: array
          items: { type: number }

    DashboardCharts:
      type: object
      properties:
        monthly_data:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              revenue: { type: number }
              expenses: { type: number }
              net: { type: number }
        account_types:
          type: array
          items:
            type: object

    PoolSummary:
      type: object
      properties:
        recent_pools:
          type: array
        summary:
          type: object
          properties:
            total_pools: { type: integer }
            active_pools: { type: integer }
            total_disbursed: { type: number }
            total_collected: { type: number }
            avg_collection_rate: { type: number }
            total_outstanding: { type: number }

    # ── Chart of Accounts ──────────────────────────────────────────

    FAccount:
      type: object
      properties:
        id: { type: integer }
        account_name: { type: string }
        description: { type: string, nullable: true }
        account_type1: { type: integer, description: '1=Budget, 2=Non-Budget' }
        account_type2: { type: integer, description: '1=Debit, 2=Credit' }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entries_count: { type: integer, nullable: true }

    FAccountInput:
      type: object
      required: [id, account_name, account_type1, account_type2, status]
      properties:
        id: { type: integer, description: 'Account code (e.g. 1203)' }
        account_name: { type: string, maxLength: 255 }
        description: { type: string }
        account_type1: { type: integer, enum: [1, 2], description: '1=Budget, 2=Non-Budget' }
        account_type2: { type: integer, enum: [1, 2], description: '1=Debit, 2=Credit' }
        status: { type: string, enum: [active, inactive] }

    # ── Journal Entry ────────────────────────────────────────────

    FEntry:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: integer, nullable: true }
        account_id: { type: integer }
        debit: { type: number }
        credit: { type: number }
        entry_date: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        account:
          type: object
          properties:
            id: { type: integer }
            account_name: { type: string }
            account_type1: { type: integer }
            account_type2: { type: integer }
        running_balance:
          type: number
          nullable: true
          description: Computed for ledger view only

    # ── Journal Transaction ──────────────────────────────────────

    FTransaction:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        checkout_id: { type: integer, nullable: true }
        customer_id: { type: integer, nullable: true }
        supplier_id: { type: integer, nullable: true }
        user_id: { type: integer }
        order_id: { type: integer, nullable: true }
        payment_id: { type: integer, nullable: true }
        transaction_type: { type: string, enum: [payment, refund, withdrawal, deposit, transfer] }
        amount: { type: number }
        status: { type: string, enum: [pending, completed, failed, cancelled] }
        transaction_date: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FEntry'

    FTransactionInput:
      type: object
      required: [user_id, transaction_type, amount, status, transaction_date]
      properties:
        reference_id: { type: string, maxLength: 255 }
        customer_id: { type: integer, nullable: true }
        supplier_id: { type: integer, nullable: true }
        user_id: { type: integer }
        order_id: { type: integer, nullable: true }
        payment_id: { type: integer, nullable: true }
        transaction_type: { type: string, enum: [payment, refund, withdrawal, deposit, transfer] }
        amount: { type: number, minimum: 0 }
        status: { type: string, enum: [pending, completed, failed, cancelled] }
        transaction_date: { type: string, format: date }
        notes: { type: string }

    # ── Expense Setting ───────────────────────────────────────────

    ExpenseSetting:
      type: object
      properties:
        id: { type: integer }
        refrence_id: { type: string }
        description: { type: string }
        amount_type: { type: string, enum: [fixed, percent] }
        amount: { type: number }
        credit_acc_id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpenseSettingInput:
      type: object
      required: [refrence_id, description, amount_type, amount, credit_acc_id]
      properties:
        refrence_id: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 255 }
        amount_type: { type: string, enum: [fixed, percent] }
        amount: { type: number, minimum: 0, description: 'Max 100 if amount_type is percent' }
        credit_acc_id: { type: integer }

    # ── Settlement ──────────────────────────────────────────────

    Settlement:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        settlement_number: { type: string }
        supplier_user_id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        settlement_date: { type: string, format: date }
        total_amount: { type: number }
        commission_amount: { type: number }
        payable_amount: { type: number }
        status: { type: string, enum: [draft, pending_approval, approved, paid, cancelled] }
        paid_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        orders_count: { type: integer, nullable: true }
        supplier:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            business_name: { type: string, nullable: true }

    PeriodSummary:
      type: object
      properties:
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        settlement_date: { type: string, format: date }
        total_amount: { type: number }
        orders_count: { type: integer }
        unsettled_amount: { type: number }
        unsettled_orders_count: { type: integer }

    # ── Supplier Payout ─────────────────────────────────────────

    SupplierPayout:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        supplier_id: { type: integer }
        order_id: { type: integer, nullable: true }
        settlement_id: { type: integer, nullable: true }
        amount: { type: number }
        status: { type: string, enum: [pending, completed, failed] }
        payout_date: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ── BNPL Transaction ──────────────────────────────────────

    Transaction:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        user_id: { type: integer }
        seller_id: { type: integer }
        order_id: { type: integer, nullable: true }
        loan_amount: { type: number }
        collected: { type: number }
        retrieved: { type: number }
        canceled: { type: number }
        subscription_fees: { type: number }
        payment_status: { type: string }
        settlement_status: { type: string, nullable: true }
        general_status: { type: string, nullable: true }
        loan_start_date: { type: string, format: date, nullable: true }
        loan_end_date: { type: string, format: date, nullable: true }
        credit_limit_at_time: { type: number }
        remaining_credit_limit: { type: number }
        created_at: { type: string, format: date-time }

    # ── Schedule Payment ──────────────────────────────────────

    SchedulePayment:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        user_id: { type: integer }
        order_id: { type: integer }
        seller_id: { type: integer }
        instalment_number: { type: integer }
        due_date: { type: string, format: date }
        instalment_amount: { type: number }
        principle_amount: { type: number }
        late_fee: { type: number }
        subscription_fee: { type: number }
        shipping_amount: { type: number }
        deducted_amount: { type: number }
        is_late: { type: boolean }
        late_days: { type: integer, nullable: true }
        payment_status: { type: string, enum: [pending, paid, late, overdue, cancelled, failed] }
        failure_reason: { type: string, nullable: true }
        payment_method: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Payment ───────────────────────────────────────────────

    Payment:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        amount: { type: number }
        payment_status: { type: string }
        payment_method: { type: string, nullable: true }
        invoice_number: { type: string, nullable: true }
        txn_code: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Wallet ────────────────────────────────────────────────

    Wallet:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        seller_id: { type: integer, nullable: true }
        order_id: { type: integer, nullable: true }
        transaction_type: { type: string, enum: [user_payment, loan_disbursment, seller_payment] }
        amount: { type: number }
        status: { type: string }
        created_at: { type: string, format: date-time }

    # ── Claim ─────────────────────────────────────────────────

    Claim:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        schedule_payment_id: { type: integer }
        user_id: { type: integer, nullable: true }
        assigned_to: { type: integer, nullable: true }
        claim_type: { type: string, enum: [call, sms, email, whatsapp, visit, letter, legal] }
        claim_status: { type: string, enum: [pending, attempted, contacted, promised, resolved, failed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        notes: { type: string, nullable: true }
        contact_method: { type: string, nullable: true }
        attempted_at: { type: string, format: date-time, nullable: true }
        contacted_at: { type: string, format: date-time, nullable: true }
        promised_payment_date: { type: string, format: date-time, nullable: true }
        customer_response: { type: string, nullable: true }
        promised_amount: { type: number, nullable: true }
        next_follow_up: { type: string, format: date-time, nullable: true }
        requires_escalation: { type: boolean }
        escalation_reason: { type: string, nullable: true }
        attempt_count: { type: integer }
        communication_log: { type: array, nullable: true }
        created_at: { type: string, format: date-time }

    ClaimInput:
      type: object
      required: [schedule_payment_id, claim_type, priority]
      properties:
        schedule_payment_id: { type: integer }
        claim_type: { type: string, enum: [call, sms, email, whatsapp, visit, letter, legal] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        notes: { type: string }
        next_follow_up: { type: string, format: date }

    # ── Refund Request ─────────────────────────────────────────

    RefundRequest:
      type: object
      properties:
        id: { type: integer }
        assigned_to: { type: integer, nullable: true }
        user_id: { type: integer }
        seller_id: { type: integer }
        order_id: { type: integer }
        seller_approval: { type: string, nullable: true }
        admin_approval: { type: string, nullable: true }
        refund_amount: { type: number }
        reason: { type: string, nullable: true }
        reject_reason: { type: string, nullable: true }
        refund_status: { type: string, enum: [pending, approved, rejected] }
        created_at: { type: string, format: date-time }

    # ── Credit Limit ───────────────────────────────────────────

    CreditLimit:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        package_id: { type: integer, nullable: true }
        simah_limit: { type: number }
        limit_arabianpay_after: { type: number }
        limit_arabianpay_before: { type: number }
        comission: { type: number }
        created_at: { type: string, format: date-time }

    # ── Investment Pool ────────────────────────────────────────

    InvestmentPool:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        expected_collections: { type: number }
        status: { type: string, enum: [active, closed] }
        total_checkouts: { type: integer, nullable: true }
        total_disbursed: { type: number }
        total_collected: { type: number }
        collection_rate: { type: number }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        days_remaining: { type: integer, nullable: true }
        is_active: { type: boolean }

    # ── Transfer Request ───────────────────────────────────────

    TransferRequest:
      type: object
      properties:
        id: { type: integer }
        from_user_id: { type: integer }
        to_user_id: { type: integer }
        model_type: { type: string }
        model_id: { type: integer }
        description: { type: string, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
        from_user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        to_user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }

    # ── Partial Payment ────────────────────────────────────────

    PartialPayment:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        employee_id: { type: integer, nullable: true }
        schedule_payment_id: { type: integer }
        partial_amount: { type: number }
        partial_due_date: { type: string, format: date, nullable: true }
        details: { type: string, nullable: true }
        status: { type: string, nullable: true }
        approval_status: { type: string, nullable: true }
        payment_method: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Promise ────────────────────────────────────────────────

    Promise:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        employee_id: { type: integer, nullable: true }
        schedule_payment_id: { type: integer }
        promise_date: { type: string, format: date }
        method: { type: string }
        notes: { type: string, nullable: true }
        status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

  responses:
    AccountUpdated:
      description: Account updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:
                $ref: '#/components/schemas/FAccount'
              message: { type: string }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
